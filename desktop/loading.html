<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>StudyForge 0.0.1</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#24382f;font-family:'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;height:100vh}
main{text-align:center}.mark{background:#276752;color:#fffefa;border-radius:22px;width:84px;height:84px;display:grid;place-items:center;margin:0 auto 24px;font:50px Georgia;box-shadow:0 6px 24px #303e2814}
